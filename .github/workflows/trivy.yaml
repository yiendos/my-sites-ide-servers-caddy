name: Docker image scan for Pull Requests
on:
  pull_request:
    types: [opened, assigned, review_requested]
jobs:
  scan:
    name: Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      #the plugin runs the official caddy image as is - scan the tag docker-compose.yml pins
      - name: Read the pinned caddy image
        id: image
        run: echo "ref=$(grep -m1 -oE 'caddy:[^[:space:]]+' docker-compose.yml)" >> "$GITHUB_OUTPUT"
      - name: Run trivy over caddy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: 'table'
          exit-code: 0
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
